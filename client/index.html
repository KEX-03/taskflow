<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        var theme = "dark";
        try {
          var savedTheme = window.localStorage.getItem("taskflow-theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch {
          // Use the dark default when browser preference storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="A beginner-friendly full-stack task manager built with MongoDB, Express, React and Node." />
    <title>TaskFlow</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
