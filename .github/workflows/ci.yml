name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets prepare-release.yml start CI on release PRs (PRs opened by a workflow don't trigger it)
  workflow_dispatch:

# The workflow only needs to read the code
permissions:
  contents: read

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run lint --prefix server
      - run: npm test
      # When the API tests (#28) need MongoDB, add a `services: mongo` block to this job

  build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run lint --prefix client
      - run: npm run build
        env:
          # Placeholder; the build only needs the variable to be set
          VITE_API_URL: http://localhost:5000/api/v1
