name: Merge on approval

# When the repo owner approves a PR, squash-merge it as soon as the required checks pass,
# with a commit message built from the PR (see .github/scripts/merge-message.js).
# Merging uses the MERGE_TOKEN secret: merges made with the built-in token wouldn't
# trigger other workflows (CI on main, the thank-you comment, publishing releases).
on:
  workflow_run:
    workflows: [Approval signal]
    types: [completed]

permissions:
  actions: read # download the PR number from the approval run
  contents: read
  pull-requests: read
  checks: read

jobs:
  merge:
    name: Squash and merge
    if: github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Checks out main (for the message script), never the PR's code
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Step 1, with the built-in read-only token: check the approval and build the commit message
      - name: Check the approval
        id: check
        uses: actions/github-script@v9
        env:
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
        with:
          script: |
            const fs = require("fs");
            const { buildMergeMessage } = require("./.github/scripts/merge-message.js");
            const REQUIRED_CHECKS = ["Server tests", "Client build"];
            const { owner, repo } = context.repo;

            if (process.env.HAS_MERGE_TOKEN !== "true") return core.setFailed("The MERGE_TOKEN secret isn't set.");

            const number = Number(fs.readFileSync("pr-number.txt", "utf8").trim());
            if (!Number.isInteger(number) || number < 1) return core.setFailed("No valid PR number in the artifact.");
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") return core.info(`#${number} isn't open; nothing to do.`);

            // The artifact only says which PR to look at. The decision comes from GitHub itself:
            // the owner's latest review must approve the PR's current commit.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const latest = reviews.filter((r) => r.user?.login === owner && r.state !== "COMMENTED").pop();
            if (latest?.state !== "APPROVED" || latest.commit_id !== pr.head.sha) {
              return core.info(`#${number} has no approval from @${owner} for its latest commit; not merging.`);
            }

            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) { closingIssuesReferences(first: 20) { nodes { number } } }
                }
              }`,
              { owner, repo, number }
            );
            const closingIssues = repository.pullRequest.closingIssuesReferences.nodes.map((issue) => issue.number);
            const { headline, body } = buildMergeMessage({ number, title: pr.title, body: pr.body, closingIssues });
            core.info(`Commit message:\n\n${headline}\n\n${body}`);

            const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
            const checksPassed = REQUIRED_CHECKS.every((name) =>
              data.check_runs.some((run) => run.name === name && run.conclusion === "success")
            );

            core.setOutput("merge", "true");
            core.setOutput("number", String(number));
            core.setOutput("node_id", pr.node_id);
            core.setOutput("sha", pr.head.sha);
            core.setOutput("headline", headline);
            core.setOutput("body", body);
            core.setOutput("checks_passed", String(checksPassed));

      # Step 2, with MERGE_TOKEN: turn on auto-merge, or merge straight away if that's refused
      - name: Merge
        if: steps.check.outputs.merge == 'true'
        uses: actions/github-script@v9
        env:
          NUMBER: ${{ steps.check.outputs.number }}
          NODE_ID: ${{ steps.check.outputs.node_id }}
          SHA: ${{ steps.check.outputs.sha }}
          HEADLINE: ${{ steps.check.outputs.headline }}
          BODY: ${{ steps.check.outputs.body }}
          CHECKS_PASSED: ${{ steps.check.outputs.checks_passed }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { NUMBER, NODE_ID, SHA, HEADLINE, BODY, CHECKS_PASSED } = process.env;
            try {
              // Merges as soon as the required checks pass
              await github.graphql(
                `mutation($id: ID!, $headline: String!, $body: String!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH, commitHeadline: $headline, commitBody: $body }) {
                    clientMutationId
                  }
                }`,
                { id: NODE_ID, headline: HEADLINE, body: BODY }
              );
              core.info(`Auto-merge enabled on #${NUMBER}: it merges when the required checks pass.`);
            } catch (err) {
              // GitHub refuses auto-merge when a PR can already be merged, so merge directly instead,
              // but only if the required checks passed: the token's owner can bypass the ruleset.
              core.info(`Couldn't enable auto-merge (${err.message}).`);
              if (CHECKS_PASSED !== "true") return core.setFailed(`Not merging #${NUMBER}: the required checks haven't passed yet.`);
              await github.rest.pulls.merge({
                owner, repo, pull_number: Number(NUMBER), sha: SHA,
                merge_method: "squash", commit_title: HEADLINE, commit_message: BODY,
              });
              core.info(`Merged #${NUMBER}.`);
            }
